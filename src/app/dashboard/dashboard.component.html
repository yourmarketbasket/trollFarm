<div class="container-fluid py-4">
  <div class="row">
    <div class="col-lg-8">
      <div class="card h-100">
        <div class="card-header pb-0">
          <h6>Generate Tweets</h6>
        </div>
        <div class="card-body p-3">
          <div class="mb-3">
            <label for="message" class="form-label">Enter your message</label>
            <textarea class="form-control" id="message" rows="3" [(ngModel)]="message"></textarea>
          </div>
          <button class="btn btn-primary" (click)="generateTweets()">Generate Tweets</button>
        </div>
      </div>
    </div>
    <div class="col-lg-4 mt-4 mt-lg-0">
      <div class="card h-100">
        <div class="card-header pb-0">
          <h6>Generated Tweets</h6>
        </div>
        <div class="card-body p-3">
          <ul class="list-group">
            <li class="list-group-item" *ngFor="let tweet of tweets">{{ tweet.text }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
